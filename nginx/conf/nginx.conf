worker_processes 1;

events {
    worker_connections 1024;
}

http {

    upstream backend {
        least_conn;
        server localhost:5001;
        server localhost:5002;
    }

    # 8080 порт - точка входа для пользователей
    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://backend;
        }
    }
}